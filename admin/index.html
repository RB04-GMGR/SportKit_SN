<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SportKit SN</title>
<link rel="icon" type="image/png" href="../assets/images/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0a0f2e 0%,#0D6EFD 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,0.25)}
.login-logo{height:60px;margin:0 auto 8px;display:block}
.login-title{text-align:center;font-size:22px;font-weight:900;color:#111827;margin-bottom:4px}
.login-sub{text-align:center;font-size:13px;color:#6B7280;margin-bottom:28px}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:#E8F1FF;color:#0D6EFD;font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;margin:0 auto 24px;display:flex;width:fit-content}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#6B7280;margin-bottom:6px}
.form-input{width:100%;background:#F5F6FA;border:1.5px solid #E5E7EB;border-radius:10px;padding:12px 16px;font-family:'Nunito',sans-serif;font-size:14px;color:#111827;outline:none;transition:border-color .15s}
.form-input:focus{border-color:#0D6EFD;background:#fff}
.form-input::placeholder{color:#9CA3AF}
.input-wrap{position:relative}
.input-wrap .form-input{padding-right:44px}
.toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9CA3AF;font-size:18px;cursor:pointer}
.btn-login{width:100%;background:#0D6EFD;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.btn-login:hover{background:#0952c6;transform:translateY(-2px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error-msg{background:#fff0f0;border:1.5px solid #FF3B30;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;color:#FF3B30;margin-top:14px;display:none;align-items:center;gap:8px}
.error-msg.show{display:flex}
.login-footer{text-align:center;font-size:12px;color:#9CA3AF;margin-top:20px}
</style>
</head>
<body>
<div class="login-card">
  <img src="../assets/images/logo1.png" alt="SportKit SN" class="login-logo">
  <div class="login-title">Espace Administration</div>
  <div class="login-sub">Accès réservé — SportKit SN</div>
  <div class="admin-badge"><i class="bi bi-shield-lock-fill"></i> Zone sécurisée</div>

  <div class="form-group">
    <label class="form-label">Email administrateur</label>
    <input type="email" class="form-input" id="email" placeholder="admin@sportkitsn.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">Mot de passe</label>
    <div class="input-wrap">
      <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password" id="pwInput">
      <button class="toggle-pw" type="button" onclick="togglePw()"><i class="bi bi-eye" id="eyeIcon"></i></button>
    </div>
  </div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">
    <i class="bi bi-box-arrow-in-right"></i> Se connecter
  </button>
  <div class="error-msg" id="errorMsg">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span id="errorText">Email ou mot de passe incorrect</span>
  </div>
  <div class="login-footer">SportKit SN © 2026 — Accès admin uniquement</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const app = initializeApp({ apiKey:"AIzaSyDQo0JvBPuJlrC4zeynhU1_sb0he5rKtFc", authDomain:"sportkit-sn.firebaseapp.com", projectId:"sportkit-sn", storageBucket:"sportkit-sn.firebasestorage.app", messagingSenderId:"619214960191", appId:"1:619214960191:web:442eda9bfac65fb5c8ea8a" });
const auth = getAuth(app);

// Si déjà connecté, rediriger
auth.onAuthStateChanged(user => { if(user) window.location.href='dashboard.html'; });

window.togglePw = () => {
  const input = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if(input.type==='password'){input.type='text';icon.className='bi bi-eye-slash';}
  else{input.type='password';icon.className='bi bi-eye';}
};

window.doLogin = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.classList.remove('show');
  if(!email||!password){document.getElementById('errorText').textContent='Remplis tous les champs';err.classList.add('show');return;}
  btn.disabled=true;btn.innerHTML='<i class="bi bi-arrow-repeat"></i> Connexion...';
  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href='dashboard.html';
  } catch(e) {
    btn.disabled=false;btn.innerHTML='<i class="bi bi-box-arrow-in-right"></i> Se connecter';
    document.getElementById('errorText').textContent='Email ou mot de passe incorrect';
    err.classList.add('show');
  }
};

document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });
</script>
</body>
</html>
